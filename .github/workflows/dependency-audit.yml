name: Dependency Audit

# Known vulnerabilities in the packages bun.lock installs. A pull request fails only for a
# vulnerable package it adds or changes: an advisory published against a package main
# already has is not the pull request's doing, and fails main's run instead. New
# advisories appear without any change here, so main is also audited three times a week.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Compares the pull request's dependency graph with its base branch's and fails on a
      # high or critical advisory against any package version the pull request brings in.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never

  audit:
    name: Bun packages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      # The audit reads bun.lock, so nothing is installed. It includes development
      # packages, which run during builds and tests.
      - name: bun audit
        run: bun audit --audit-level=high
