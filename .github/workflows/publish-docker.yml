name: publish docker image
run-name: Publish ${{ inputs.channel }}${{ inputs.version && format(' {0}', inputs.version) || '' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Image channel (release also updates latest)
        type: choice
        options: [nightly, release]
        default: nightly
        required: true
      version:
        description: Release version, for example 0.1.1 (leave empty for nightly)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Validate channel and version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$CHANNEL" in
            nightly)
              if [ -n "$RELEASE_VERSION" ]; then
                echo '::error::Leave version empty for nightly builds.'
                exit 1
              fi
              version=nightly
              ;;
            release)
              if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo '::error::Release version must be X.Y.Z, for example 0.1.1.'
                exit 1
              fi
              version="$RELEASE_VERSION"
              ;;
            *)
              echo '::error::Choose the nightly or release channel.'
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=${{ env.DOCKER_USERNAME }}/reddont,enable=${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable=${{ inputs.channel == 'nightly' }}
            type=raw,value=nightly-{{date 'YYYY-MM-DD'}},enable=${{ inputs.channel == 'nightly' }}
            type=sha,format=short,enable=${{ inputs.channel == 'nightly' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ inputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ inputs.channel == 'release' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Each platform's image is built and scanned before anything is pushed: Grype fails
      # on high or critical vulnerabilities that have a fix, which stops the publish. The
      # push below reuses these builds' layers from the builder's cache.
      - name: Build the amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: reddont:scan-amd64
          cache-from: type=gha,scope=docker-${{ inputs.channel }}

      - name: Scan the amd64 image before publishing
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker:reddont:scan-amd64
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Build the arm64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: reddont:scan-arm64
          cache-from: type=gha,scope=docker-${{ inputs.channel }}

      - name: Scan the arm64 image before publishing
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker:reddont:scan-arm64
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ inputs.channel }}
          cache-to: type=gha,mode=max,scope=docker-${{ inputs.channel }}
