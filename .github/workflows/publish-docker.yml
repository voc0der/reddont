name: publish docker image
run-name: Publish ${{ inputs.channel }}${{ inputs.version && format(' {0}', inputs.version) || '' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Image channel (release also updates latest)
        type: choice
        options: [nightly, release]
        default: nightly
        required: true
      version:
        description: Release version, for example 0.1.1 (leave empty for nightly)
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Validate channel and version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$CHANNEL" in
            nightly)
              if [ -n "$RELEASE_VERSION" ]; then
                echo '::error::Leave version empty for nightly builds.'
                exit 1
              fi
              version=nightly
              ;;
            release)
              if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo '::error::Release version must be X.Y.Z, for example 0.1.1.'
                exit 1
              fi
              version="$RELEASE_VERSION"
              ;;
            *)
              echo '::error::Choose the nightly or release channel.'
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=${{ env.DOCKER_USERNAME }}/reddont,enable=${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable=${{ inputs.channel == 'nightly' }}
            type=raw,value=nightly-{{date 'YYYY-MM-DD'}},enable=${{ inputs.channel == 'nightly' }}
            type=sha,format=short,enable=${{ inputs.channel == 'nightly' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ inputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ inputs.channel == 'release' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ inputs.channel }}
          cache-to: type=gha,mode=max,scope=docker-${{ inputs.channel }}
