name: Semgrep Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 12:00 UTC
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan Code
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --error fails the job on any finding. Silence a reviewed false
      # positive with a "nosemgrep: <rule id>" comment and a reason above it.
      # The Pug href rule is a regex that flags every href not written as a
      # quoted literal, site paths built in template literals included; the
      # links that carry a URL from Reddit's data pass through safeExternalUrl
      # (src/mixins/postUtils.pug), which keeps only http and https.
      - name: Run Semgrep
        run: >-
          semgrep scan --config=auto --error
          --exclude-rule javascript.express.security.audit.xss.pug.var-in-href.var-in-href
